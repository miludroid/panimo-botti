name: Panimo-botti

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  tarkista-uutuudet:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna Python-riippuvuudet
        run: pip install requests anthropic playwright

      - name: Asenna Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Lataa muistilista edellisesta ajosta
        uses: actions/cache@v4
        with:
          path: seen_beers.json
          key: seen-beers-${{ github.run_id }}
          restore-keys: |
            seen-beers-

      - name: Aja panimo-botti
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python panimo_bot.py

      - name: Tallenna muistilista seuraavaa ajoa varten
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_beers.json
          key: seen-beers-${{ github.run_id }}
