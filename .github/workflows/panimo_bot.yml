name: Panimo-botti

on:
  schedule:
    # Joka päivä klo 20:00 Suomen aikaa (kesällä UTC+3 = 17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:
    # Manuaalinen ajo GitHubista testaamista varten

jobs:
  tarkista-uutuudet:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna Python-riippuvuudet
        run: pip install requests anthropic playwright

      - name: Asenna Playwright + Chromium
        run: playwright install chromium --with-deps

      - name: Aja panimo-botti
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python panimo_bot.py
